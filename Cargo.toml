[workspace.package]
version = "1.2.5"
edition = "2024"
authors = ["daheige"]
description = "rust infra"
keywords = ["infra", "rust-infra", "mysql", "redis", "pulsar"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/rs-god/hera"

[workspace]
resolver = "3"

members = [
    "crates/config",
    "crates/crypto",
    "crates/logger",
    "crates/monitor",
    "crates/shutdown",
    "crates/xmysql",
    "crates/xredis",
    "crates/xpulsar"
]

[workspace.dependencies]
# serde
serde_yaml = "0.9.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# crypto
aes = "0.9.3"
cbc = "0.2.1"
rand = "0.10.2"
base64 = "0.23.1"

# logger
log = { version = "0.4.34", features = ["kv"] }
env_logger = { version = "0.11.11", features = ["color"] }
chrono = "0.4.45"

# autometrics-rs for auto prometheus metrics sla
autometrics = { version = "3.0.0", features = ["prometheus-exporter"] }
axum = "0.8.9"

tokio = { version = "1.53.1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "mysql", "chrono", "time"] }
futures = "0.3.34"

# redis use tokio async
redis = { version = "1.7.0", features = ["r2d2", "tokio-comp", "cluster", "cluster-async", "json"] }
r2d2 = "0.8.10"

# pulsar
pulsar = "6.9.0"
